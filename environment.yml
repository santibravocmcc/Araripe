name: araripe
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # ─── System-level geospatial libraries (conda handles these cleanly) ──────
  - gdal>=3.8
  - libgdal>=3.8
  - proj>=9.3
  - geos>=3.12
  # ─── Core raster/vector stack ─────────────────────────────────────────────
  - rasterio>=1.3.10
  - geopandas>=1.0.0
  - shapely>=2.0.0
  - fiona>=1.9.0
  - pyproj>=3.6.0
  # ─── Numerical / scientific ───────────────────────────────────────────────
  - numpy>=1.26.0
  - scipy>=1.14.0
  - scikit-learn>=1.5.0
  - statsmodels>=0.14.0
  - dask>=2024.1.0
  - xarray>=2024.1.0
  # ─── Storage / DB ────────────────────────────────────────────────────────
  # boto3 e botocore fixados no mesmo minor: sem isso o conda pegava
  # boto3 1.43.x com botocore 1.43.0 (defasado), quebrando o import
  # (ImportError: cannot import name 'DocumentModifiedShape').
  - boto3>=1.35.0,<1.36.0
  - botocore>=1.35.0,<1.36.0
  - duckdb>=1.1.0
  # ─── Utilities ───────────────────────────────────────────────────────────
  - python-dotenv>=1.0.0
  - tqdm>=4.66.0
  - click>=8.1.0
  # Já vinha como dependência transitiva do dask; declarado porque
  # tests/test_workflow_lanes.py lê os workflows do Actions diretamente.
  - pyyaml>=6.0
  # Do Package 2A.6: os pacotes de método das Fases 2A.4/2A.5 renderizam
  # figuras. Declarado aqui porque a `main` passa a conter aqueles scripts.
  - pillow>=10.0.0
  # NÃO vinha transitivamente (verificado com `conda env create --dry-run`):
  # adiciona 4 pacotes puros-Python (jsonschema, jsonschema-specifications,
  # referencing, rpds-py) e não muda a versão de nenhum pacote existente.
  # Necessário porque o portão de publicação valida o ledger do Package 2A.6
  # contra o schema fixado (src/publication/ledger_binding.py). Esta é a
  # convergência que o comentário anterior antecipava: os dois arquivos
  # descreviam o mesmo ambiente por caminhos separados, e agora são um.
  - jsonschema>=4.23.0
  # ─── Testing ─────────────────────────────────────────────────────────────
  - pytest>=8.0.0
  # ─── Pip-only packages (not on conda-forge or newer versions needed) ────
  - pip
  - pip:
      - pystac-client>=0.8.0
      - planetary-computer>=1.0.0
      - earthaccess>=0.12.0
      - rioxarray>=0.17.0
      - stackstac>=0.5.1
      - odc-stac>=0.3.10
      - rio-tiler>=7.0.0
      - loguru>=0.7.0
