name: Streaming Detection (manual fallback)

# Manual-only fallback to the scheduled GEE path (detect_gee.yml). Streams
# current Sentinel-2 scenes from AWS and runs run_detection.py — works on a CI
# runner (fast network), unlike a throttled home connection. Use it if GEE is
# unavailable. Not on a schedule: only ONE path should run automatically, and
# that is detect_gee.yml (running both would double-detect and fight on push).
#
# Same R2 data flow as detect_gee.yml: baselines + recent alerts fetched from
# R2; new alerts uploaded to R2 (not committed); only the time-series DB is
# committed — and, since `main` is ruleset-protected, that commit reaches `main`
# through an automatic PR (see the publish step) instead of a direct push.

on:
  workflow_dispatch:       # Manual trigger only

permissions:
  contents: write
  pull-requests: write   # the time-series DB reaches `main` via a PR, not a push

# One writer at a time for the blue persistence state (Package 2B.1). This file
# and `update_data.yml` both read-modify-write the SAME R2 object
# (`persistence_state.geojson`), so they share ONE group: separate groups would
# serialize each workflow against itself and still let the two interleave. The
# lane never cancels — a detection run that is killed mid-flight has already
# written alerts to R2 and would leave the state behind them.
concurrency:
  group: araripe-legacy-state
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: araripe
          auto-activate-base: false
          use-mamba: true
          miniforge-version: latest

      - name: Fetch reflectance baselines from R2
        if: env.R2_ENDPOINT_URL != ''
        run: python scripts/fetch_baselines_from_r2.py

      - name: Fetch persistence state from R2 (gap-tolerant tracking)
        # `--require-existing`: see detect_gee.yml — an absent state here is a
        # deletion or a misconfiguration, never a first run.
        if: env.R2_ENDPOINT_URL != ''
        run: python scripts/r2_state.py get data/persistence_state.geojson --require-existing

      - name: Run detection pipeline
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: python scripts/run_detection.py

      - name: Upload alerts to R2
        if: success() && env.R2_ENDPOINT_URL != ''
        run: python scripts/upload_to_r2.py --directory data/alerts --prefix alerts/ --pattern "*.geojson"

      - name: Upload persistence state to R2
        if: success() && env.R2_ENDPOINT_URL != ''
        run: python scripts/r2_state.py put data/persistence_state.geojson

      - name: Write the time-series release signal
        # Replaces the site's fixed clock offset with something it can validate
        # (Package 2B.1). Written BEFORE `git add data/timeseries/`, so it rides
        # the same squash-merged PR as the DB and is atomic with it; the site
        # refuses to publish unless the DB it holds matches this checksum.
        #
        # Deliberate: this runs on EVERY successful run, including runs where
        # the series did not change, so the file always advances. That is what
        # makes it a freshness signal — otherwise a broken backend and a quiet
        # one would look identical to the site. The cost is one small commit
        # per run. See ROADMAP.md §6.
        if: success()
        run: python scripts/write_release_signal.py

      - name: Publish time-series DB through a pull request
        # Same lane as detect_gee.yml: the ruleset "Protect main — pull requests
        # only" has no bypass actors, so the bot merges a PR instead of pushing.
        # `shell: bash` and the absence of any explicit `exit 0` are deliberate —
        # see the long comment on the same step in detect_gee.yml and ROADMAP.md §6.
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/timeseries/
          if git diff --staged --quiet; then
            echo "time-series unchanged; nothing to publish"
          else
            unexpected="$(git diff --staged --name-only | grep -v '^data/timeseries/' || true)"
            if [ -n "$unexpected" ]; then
              echo "::error::refusing to open a PR touching paths outside data/timeseries/"
              echo "$unexpected"
              exit 1
            fi
            git commit -m "chore: update time-series $(date +%Y-%m-%d)"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::rebase onto origin/main failed (concurrent time-series change?)"
              git rebase --abort || true
              exit 1
            fi
            branch="auto/timeseries-${GITHUB_RUN_ID}"
            git push origin "HEAD:refs/heads/${branch}"
            pr_url="$(gh pr create --base main --head "${branch}" \
              --title "chore: update time-series $(date +%Y-%m-%d)" \
              --body "Automated time-series DB update from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Only \`data/timeseries/\` changes; alerts themselves live in R2.")"
            echo "opened ${pr_url}"
            merged=0
            for attempt in 1 2 3 4 5; do
              if gh pr merge "${pr_url}" --squash --delete-branch; then
                merged=1
                break
              fi
              echo "merge not ready yet (attempt ${attempt}); retrying in 15s"
              sleep 15
            done
            if [ "$merged" -ne 1 ]; then
              echo "::error::${pr_url} was opened but not merged automatically; merge it by hand"
              exit 1
            fi
            echo "merged ${pr_url}"
          fi
