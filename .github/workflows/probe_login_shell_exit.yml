name: probe login-shell exit status

# THROWAWAY DIAGNOSTIC — must never reach `main`.
# Why the "Publish time-series DB through a pull request" step exits 1 right
# after printing "merged <pr url>" (runs 20/08 and 24/08).
#
# Probe v1 (no conda) showed `bash -l {0}` + explicit `exit 0` PASSES, so the
# login shell alone is not the cause. Missing factor found in the failing log:
# conda-incubator/setup-miniconda deletes ~/.bashrc, ~/.bash_profile and
# ~/.profile, then writes a ~/.profile ending in
#     set -eo pipefail
#     conda activate "araripe"
# so every `bash -l {0}` step in that job runs with `-e` inherited from the
# profile. A non-interactive login shell runs ~/.bash_logout only when `exit`
# is called explicitly, and the runner's ~/.bash_logout runs
# `/usr/bin/clear_console -q` (SHLVL=1), which fails without a TTY. Under `-e`
# that failure may replace the requested status. This probe settles it.

on:
  push:
    branches: ['probe/**']

permissions:
  contents: read

jobs:
  with-conda:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -l {0}   # exactly the detect_gee.yml default

    steps:
      - uses: actions/checkout@v4

      - name: Set up Conda (same as detect_gee.yml)
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: araripe
          auto-activate-base: false
          use-mamba: true
          miniforge-version: latest

      - name: Shell state inherited by every step
        run: |
          echo "BASH_VERSION=$BASH_VERSION SHLVL=$SHLVL CONDA_PREFIX=$CONDA_PREFIX"
          echo "--- set -o (errexit/pipefail?) ---"
          set -o | grep -E 'errexit|pipefail'
          echo "--- trap -p ---"
          trap -p || echo "(no traps)"
          echo "--- tail ~/.profile ---"
          tail -8 ~/.profile 2>&1 || echo "(no ~/.profile)"
          echo "--- ~/.bash_logout ---"
          cat ~/.bash_logout 2>&1 || echo "(no ~/.bash_logout)"

      - id: a
        name: 'A: conda + login shell + explicit exit 0'
        continue-on-error: true
        run: |
          echo body
          exit 0

      - id: b
        name: 'B: conda + login shell, ends at EOF'
        continue-on-error: true
        run: |
          echo body
          true

      - id: c
        name: 'C: conda + plain bash + explicit exit 0'
        shell: bash
        continue-on-error: true
        run: |
          echo body
          exit 0

      - id: e
        name: 'E: conda + login shell + set +e + explicit exit 0'
        continue-on-error: true
        run: |
          set +e
          echo body
          exit 0

      - id: f
        name: 'F: conda + login shell, real failing shape (for/if/exit 0)'
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5; do
            if true; then
              echo "merged (simulated)"
              exit 0
            fi
            echo "not ready (attempt ${attempt})"
            sleep 1
          done
          echo "::error::simulated failure"
          exit 1

      - id: g
        name: 'G: conda + login shell, PROPOSED FIX (no explicit exit 0)'
        continue-on-error: true
        run: |
          merged=0
          for attempt in 1 2 3 4 5; do
            if true; then
              merged=1
              break
            fi
            echo "not ready (attempt ${attempt})"
            sleep 1
          done
          if [ "$merged" -ne 1 ]; then
            echo "::error::simulated failure"
            exit 1
          fi
          echo "merged (simulated)"

      - id: h
        name: 'H: conda + plain bash, PROPOSED FIX'
        shell: bash
        continue-on-error: true
        run: |
          merged=0
          for attempt in 1 2 3 4 5; do
            if true; then
              merged=1
              break
            fi
            sleep 1
          done
          if [ "$merged" -ne 1 ]; then
            echo "::error::simulated failure"
            exit 1
          fi
          echo "merged (simulated)"

      - name: Verdict
        run: |
          echo "A  conda login + exit 0            : ${{ steps.a.outcome }}"
          echo "B  conda login + EOF               : ${{ steps.b.outcome }}"
          echo "C  conda plain + exit 0            : ${{ steps.c.outcome }}"
          echo "E  conda login + set +e + exit 0   : ${{ steps.e.outcome }}"
          echo "F  conda login + real shape        : ${{ steps.f.outcome }}"
          echo "G  conda login + PROPOSED FIX      : ${{ steps.g.outcome }}"
          echo "H  conda plain + PROPOSED FIX      : ${{ steps.h.outcome }}"
