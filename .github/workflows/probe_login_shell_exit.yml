name: probe login-shell exit status

# THROWAWAY DIAGNOSTIC — must never reach `main`.
#
# v1 (no conda) and v2 (with conda) both showed that `bash -l {0}` + explicit
# `exit 0` PASSES, even with `set -eo pipefail` inherited from the ~/.profile
# that setup-miniconda writes, SHLVL=1 and the Ubuntu ~/.bash_logout in place.
# So the shell is NOT the cause. v3 replicates the actual git + gh sequence of
# the failing step, against a throwaway base branch (never `main`), and
# contrasts the current shape (explicit `exit 0`) with the proposed fix shape.

on:
  push:
    branches: ['probe/**']

permissions:
  contents: write
  pull-requests: write

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Conda (same as detect_gee.yml)
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: araripe
          auto-activate-base: false
          use-mamba: true
          miniforge-version: latest

      - name: Throwaway base branch (never main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          base="probe-base-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${base}"
          echo "BASE=${base}" >> "$GITHUB_ENV"
          echo "base branch: ${base}"

      - id: p1
        name: 'P1: real git+gh sequence, CURRENT shape (explicit exit 0)'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head="probe-head1-${GITHUB_RUN_ID}"
          echo "p1" > probe_marker.txt
          git add probe_marker.txt
          git commit -m "probe p1"
          git push origin "HEAD:refs/heads/${head}"
          pr_url="$(gh pr create --base "$BASE" --head "${head}" \
            --title "probe p1" --body "throwaway diagnostic")"
          echo "opened ${pr_url}"
          for attempt in 1 2 3 4 5; do
            if gh pr merge "${pr_url}" --squash --delete-branch; then
              echo "merged ${pr_url}"
              exit 0
            fi
            echo "merge not ready yet (attempt ${attempt}); retrying in 15s"
            sleep 15
          done
          echo "::error::${pr_url} was opened but not merged automatically"
          exit 1

      - id: p2
        name: 'P2: real git+gh sequence, PROPOSED shape (no explicit exit 0)'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin "$BASE"
          git reset --hard "origin/$BASE"
          head="probe-head2-${GITHUB_RUN_ID}"
          echo "p2" > probe_marker.txt
          git add probe_marker.txt
          git commit -m "probe p2"
          git push origin "HEAD:refs/heads/${head}"
          pr_url="$(gh pr create --base "$BASE" --head "${head}" \
            --title "probe p2" --body "throwaway diagnostic")"
          echo "opened ${pr_url}"
          merged=0
          for attempt in 1 2 3 4 5; do
            if gh pr merge "${pr_url}" --squash --delete-branch; then
              merged=1
              break
            fi
            echo "merge not ready yet (attempt ${attempt}); retrying in 15s"
            sleep 15
          done
          if [ "$merged" -ne 1 ]; then
            echo "::error::${pr_url} was opened but not merged automatically"
            exit 1
          fi
          echo "merged ${pr_url}"

      - id: p3
        name: 'P3: same as P1 but plain bash (non-login) shell'
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin "$BASE"
          git reset --hard "origin/$BASE"
          head="probe-head3-${GITHUB_RUN_ID}"
          echo "p3" > probe_marker.txt
          git add probe_marker.txt
          git commit -m "probe p3"
          git push origin "HEAD:refs/heads/${head}"
          pr_url="$(gh pr create --base "$BASE" --head "${head}" \
            --title "probe p3" --body "throwaway diagnostic")"
          echo "opened ${pr_url}"
          for attempt in 1 2 3 4 5; do
            if gh pr merge "${pr_url}" --squash --delete-branch; then
              echo "merged ${pr_url}"
              exit 0
            fi
            echo "merge not ready yet (attempt ${attempt}); retrying in 15s"
            sleep 15
          done
          echo "::error::not merged"
          exit 1

      - name: Verdict
        run: |
          echo "P1 login + real sequence + exit 0   : ${{ steps.p1.outcome }}"
          echo "P2 login + real sequence, no exit 0 : ${{ steps.p2.outcome }}"
          echo "P3 plain + real sequence + exit 0   : ${{ steps.p3.outcome }}"

      - name: Clean up throwaway branches
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for b in "probe-base-${GITHUB_RUN_ID}" \
                   "probe-head1-${GITHUB_RUN_ID}" \
                   "probe-head2-${GITHUB_RUN_ID}" \
                   "probe-head3-${GITHUB_RUN_ID}"; do
            git push origin --delete "$b" 2>/dev/null && echo "deleted $b" || echo "already gone: $b"
          done
