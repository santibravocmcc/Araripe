name: GEE Deforestation Detection (headless)

# Scheduled, fully-automated Google Earth Engine detection: service account ->
# tiled synchronous pull -> existing detection logic. Runs twice a week and can
# also be triggered manually (with a custom date range) via "Run workflow".
#
# Data flow (nothing large in git):
#   - baselines are fetched from Cloudflare R2 (fetch_baselines_from_r2.py);
#   - recent alerts are fetched from R2 so temporal persistence can chain;
#   - new alerts are UPLOADED to R2 (alerts/ prefix), NOT committed to git
#     (they'd grow ~1-2 GB/year and blow the free Git-LFS tier); only the small
#     time-series DB is committed.
# The static Cloudflare site ingests alerts from R2 + the DB from git.
#
# Required repo config:
#   - secret  GEE_SA_KEY  : full service-account JSON key. The service account
#                           needs the **Earth Engine Resource Writer** role
#                           (roles/earthengine.writer) on a registered,
#                           EE-API-enabled project — Viewer is NOT enough
#                           (it lacks computations.create / thumbnails.create).
#   - secrets R2_ENDPOINT_URL / R2_ACCESS_KEY / R2_SECRET_KEY
#   - var     EE_PROJECT   : Earth Engine project id (defaults to ee-araripe)
#   - setting Actions > General > "Allow GitHub Actions to create and approve
#                           pull requests" MUST be enabled: `main` is protected
#                           by the ruleset "Protect main — pull requests only"
#                           (no bypass actors), so this job publishes the
#                           time-series DB through a PR instead of pushing.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD (blank = today - 16 days)"
        required: false
      end:
        description: "End date YYYY-MM-DD exclusive (blank = tomorrow)"
        required: false
  schedule:
    - cron: '0 6 * * 1,4'   # Monday & Thursday 06:00 UTC

permissions:
  contents: write
  pull-requests: write   # the time-series DB reaches `main` via a PR, not a push

jobs:
  detect-gee:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      GEE_SA_KEY: ${{ secrets.GEE_SA_KEY }}
      EE_PROJECT: ${{ vars.EE_PROJECT || 'ee-araripe' }}
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # No lfs: baselines + alerts come from R2; land-cover rasters are plain git.

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: araripe
          auto-activate-base: false
          use-mamba: true
          miniforge-version: latest

      - name: Install Earth Engine client
        run: pip install -q earthengine-api requests

      - name: Fetch reflectance baselines from R2
        if: env.R2_ENDPOINT_URL != ''
        run: python scripts/fetch_baselines_from_r2.py

      - name: Fetch persistence state from R2 (gap-tolerant tracking)
        # The gap-tolerant persistence chains alerts across runs via a running
        # track state (n_sightings, first/last_seen) instead of re-reading recent
        # alert files. First run: no state yet -> starts fresh (all 1ª observação).
        if: env.R2_ENDPOINT_URL != ''
        run: python scripts/r2_state.py get data/persistence_state.geojson

      - name: Run GEE detection
        env:
          START: ${{ github.event.inputs.start }}
          END: ${{ github.event.inputs.end }}
        run: |
          python scripts/run_detection_gee.py \
            --project "$EE_PROJECT" --start "$START" --end "$END"

      - name: Upload alerts to R2
        if: success() && env.R2_ENDPOINT_URL != ''
        run: python scripts/upload_to_r2.py --directory data/alerts --prefix alerts/ --pattern "*.geojson"

      - name: Upload persistence state to R2
        if: success() && env.R2_ENDPOINT_URL != ''
        run: python scripts/r2_state.py put data/persistence_state.geojson

      - name: Publish time-series DB through a pull request
        # `main` is protected by the repository ruleset "Protect main — pull
        # requests only" with an empty bypass list, so github-actions[bot]
        # cannot push here (GH013). It pushes a throwaway branch and merges it
        # through a PR instead; the ruleset requires zero approvals, so the
        # GITHUB_TOKEN can merge its own PR.
        #
        # `shell: bash` deliberately overrides the job default `bash -l {0}`,
        # and the body below never calls `exit 0`. Both guard the same trap,
        # which made the runs of 20/08 and 24/08 report failure AFTER publishing
        # successfully (PRs #13 and #14 are merged on `main`):
        #   * setup-miniconda rewrites ~/.profile ending in `set -eo pipefail`,
        #     so every `bash -l {0}` step inherits errexit;
        #   * a non-interactive login shell sources ~/.bash_logout only when the
        #     `exit` builtin runs explicitly, and the runner's ~/.bash_logout
        #     runs `/usr/bin/clear_console -q` (SHLVL=1), which fails with no TTY;
        #   * under errexit that failure replaces the requested status, so
        #     `exit 0` left the step with exit code 1. Steps that end at EOF, or
        #     that run in a non-login shell, never touch ~/.bash_logout.
        # This step is pure git/gh and needs no conda env. See ROADMAP.md §6.
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/timeseries/
          if git diff --staged --quiet; then
            echo "time-series unchanged; nothing to publish"
          else
            # This lane must never carry anything but the time-series DB.
            # (Captured `grep -v` instead of `grep -qv`: the -q/-v combination is
            # not portable across grep implementations.)
            unexpected="$(git diff --staged --name-only | grep -v '^data/timeseries/' || true)"
            if [ -n "$unexpected" ]; then
              echo "::error::refusing to open a PR touching paths outside data/timeseries/"
              echo "$unexpected"
              exit 1
            fi
            git commit -m "chore: update time-series $(date +%Y-%m-%d)"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::rebase onto origin/main failed (concurrent time-series change?)"
              git rebase --abort || true
              exit 1
            fi
            branch="auto/timeseries-${GITHUB_RUN_ID}"
            git push origin "HEAD:refs/heads/${branch}"
            pr_url="$(gh pr create --base main --head "${branch}" \
              --title "chore: update time-series $(date +%Y-%m-%d)" \
              --body "Automated time-series DB update from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Only \`data/timeseries/\` changes; alerts themselves live in R2.")"
            echo "opened ${pr_url}"
            # Mergeability is computed asynchronously, so retry for a short while.
            merged=0
            for attempt in 1 2 3 4 5; do
              if gh pr merge "${pr_url}" --squash --delete-branch; then
                merged=1
                break
              fi
              echo "merge not ready yet (attempt ${attempt}); retrying in 15s"
              sleep 15
            done
            if [ "$merged" -ne 1 ]; then
              echo "::error::${pr_url} was opened but not merged automatically; merge it by hand"
              exit 1
            fi
            echo "merged ${pr_url}"
          fi
